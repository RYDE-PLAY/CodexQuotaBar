name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          test "$TAG" = "v$VERSION"
      - name: Test
        run: swift test
      - name: Build universal app
        run: ./Scripts/build-app.sh release universal
      - name: Verify and package
        run: |
          codesign --verify --deep --strict Build/CodexQuotaBar.app
          lipo Build/CodexQuotaBar.app/Contents/MacOS/CodexQuotaBar -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent Build/CodexQuotaBar.app Build/CodexQuotaBar-macOS-universal.zip
          cd Build
          shasum -a 256 CodexQuotaBar-macOS-universal.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file .github/release-notes.md
          gh release upload "$TAG" Build/CodexQuotaBar-macOS-universal.zip Build/SHA256SUMS.txt
          gh release edit "$TAG" --draft=false
